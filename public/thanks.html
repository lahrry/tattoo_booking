<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You — MATT Tattoo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --line: #e5e7eb;
      --text: #111;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: var(--text);

      font-family:
        "Gill Sans",
        "Gill Sans MT",
        Calibri,
        "Trebuchet MS",
        system-ui,
        Arial;
    }

    .card {
      width: min(560px, calc(100% - 28px));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      background: #fff;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid var(--line);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(26px, 3vw, 34px);
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid #111;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .sub {
      margin-top: 14px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="card">
    <!-- 프로필 이미지 재사용 -->
    <img src="/works/0.jpg" alt="MATT Tattoo" class="avatar" />

    <h1>Thank you 🙏</h1>

    <p>
      Thank you for submitting.<br/>
      I will get back to you via DM or email!
    </p>

    <a href="/" class="btn">Back to Home</a>

    <div class="sub">
      MATT Tattoo · Booking
    </div>
  </div>
</body>
</html>
